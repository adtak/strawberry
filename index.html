<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>くくの ぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8e7;
  --card: #ffffff;
  --ink: #3b2f2a;
  --sub: #8a7a70;
  --main: #ff7a59;
  --main-dark: #e85c3a;
  --blue: #4aa3ff;
  --green: #4cc38a;
  --yellow: #ffd23f;
  --pink: #ff8fb1;
  --purple: #9b7bff;
  --line: #f0e2c8;
  --shadow: 0 6px 0 rgba(0,0,0,.08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(#ffe9b8 1.5px, transparent 1.5px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  font-weight: 500;
  user-select: none;
}
#app { max-width: 560px; margin: 0 auto; padding: 16px; min-height: 100%; }
.screen { display: none; animation: pop .25s ease; }
.screen.active { display: block; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

h1 { font-size: 40px; font-weight: 800; text-align: center; margin: 16px 0 4px; color: var(--main); letter-spacing: 2px; text-shadow: 3px 3px 0 #ffd9a8; }
h2 { font-size: 26px; font-weight: 800; text-align: center; margin: 8px 0 16px; }
.lead { text-align: center; color: var(--sub); margin: 0 0 20px; }

button { font-family: inherit; font-weight: 800; cursor: pointer; border: none; color: var(--ink); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 18px; margin: 0 0 14px; border-radius: 20px;
  font-size: 22px; background: var(--card); box-shadow: var(--shadow);
  transition: transform .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.btn .ico { font-size: 30px; }
.btn.orange { background: var(--main); color: #fff; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.green { background: var(--green); color: #fff; }
.btn.purple { background: var(--purple); color: #fff; }
.btn.small { font-size: 17px; padding: 12px; border-radius: 16px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.back { background: var(--card); border-radius: 14px; padding: 8px 14px; font-size: 16px; box-shadow: var(--shadow); }
.toggle { background: var(--card); border-radius: 14px; padding: 8px 12px; font-size: 18px; box-shadow: var(--shadow); }

/* stamps */
.stamps { background: var(--card); border-radius: 20px; padding: 14px; margin: 8px 0 20px; box-shadow: var(--shadow); }
.stamps-title { font-size: 15px; color: var(--sub); text-align: center; margin-bottom: 8px; }
.stamp-row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
.stamp { aspect-ratio: 1; border-radius: 50%; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #d6c8b0; }
.stamp.got { border: none; background: var(--yellow); color: var(--ink); font-size: 20px; animation: stampIn .4s ease; }
@keyframes stampIn { 0% { transform: scale(2) rotate(-20deg); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* dan select */
.dan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.dan-btn { aspect-ratio: 1; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); font-size: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.dan-btn small { font-size: 14px; color: var(--sub); }
.dan-btn .mon { font-size: 26px; }
.dan-btn .badge { position: absolute; top: 6px; right: 8px; font-size: 18px; }
.dan-btn:active { transform: translateY(4px); }
.dan-btn.mix { grid-column: span 3; aspect-ratio: auto; padding: 14px; flex-direction: row; gap: 10px; font-size: 22px; background: var(--purple); color: #fff; }

/* learn */
.learn-list { background: var(--card); border-radius: 20px; padding: 8px; box-shadow: var(--shadow); }
.learn-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 14px; cursor: pointer; }
.learn-item + .learn-item { border-top: 2px dotted var(--line); }
.learn-item.on { background: #fff1d0; }
.learn-item .eq { font-size: 24px; font-weight: 800; }
.learn-item .yomi { font-size: 15px; color: var(--main-dark); }
.learn-item .spk { font-size: 20px; }

/* dots */
.dots-box { background: var(--card); border-radius: 20px; padding: 12px; margin: 12px 0; box-shadow: var(--shadow); text-align: center; }
.dots-caption { font-size: 16px; color: var(--sub); margin-bottom: 8px; }
.dots { display: inline-grid; gap: 4px; }
.dot { width: 16px; height: 16px; border-radius: 50%; }
.dots.big .dot { width: 22px; height: 22px; }

/* battle */
.battle-head { display: flex; justify-content: space-between; align-items: center; font-size: 16px; color: var(--sub); }
.combo { color: var(--main); font-weight: 800; }
.arena { position: relative; text-align: center; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.monster { font-size: 100px; line-height: 1; transition: transform .2s, opacity .4s; }
.monster.hit { animation: hit .4s ease; }
.monster.angry { animation: angry .4s ease; }
.monster.dead { transform: scale(0) rotate(360deg); opacity: 0; transition: transform .7s ease-in, opacity .7s; }
@keyframes hit { 0%,100% { transform: none; } 20% { transform: translateX(-14px) rotate(-10deg); filter: brightness(2); } 50% { transform: translateX(12px) rotate(8deg); } }
@keyframes angry { 0%,100% { transform: none; } 50% { transform: scale(1.25); } }
.hp { width: 70%; height: 16px; background: #f1e6d2; border-radius: 10px; overflow: hidden; margin-top: 8px; }
.hp > div { height: 100%; background: linear-gradient(90deg, var(--green), #8ee6a8); transition: width .4s; }
.dmg { position: absolute; top: 20px; font-size: 32px; font-weight: 800; color: var(--main); animation: float 0.8s ease forwards; pointer-events: none; }
@keyframes float { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-50px); opacity: 0; } }

.question { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; text-align: center; font-size: 46px; font-weight: 800; letter-spacing: 2px; }
.question .ans { display: inline-block; min-width: 1.6em; border-bottom: 4px solid var(--main); color: var(--main); }
.question.ok { background: #e1f7ea; }
.question.ng { background: #ffe6ea; }
.tools { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
.tools button { background: var(--card); border-radius: 14px; padding: 8px 14px; font-size: 16px; box-shadow: var(--shadow); }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key { padding: 14px 0; font-size: 30px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
.key:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.key.del { background: #ffe1d6; font-size: 22px; }
.key.go { background: var(--main); color: #fff; font-size: 22px; }

/* feedback modal */
.modal { position: fixed; inset: 0; background: rgba(60,40,20,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal.show { display: flex; }
.modal-card { background: var(--card); border-radius: 26px; padding: 20px; max-width: 420px; width: 100%; text-align: center; animation: pop .25s ease; }
.modal-card .big { font-size: 34px; font-weight: 800; margin: 6px 0; }
.modal-card .yomi { color: var(--main-dark); font-size: 18px; margin-bottom: 6px; }

/* time attack */
.timer { height: 14px; background: #f1e6d2; border-radius: 10px; overflow: hidden; margin: 6px 0 12px; }
.timer > div { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--main)); width: 100%; }
.score-big { font-size: 64px; font-weight: 800; text-align: center; color: var(--main); }

/* table */
.kuku-table { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background: var(--card); padding: 8px; border-radius: 18px; box-shadow: var(--shadow); }
.cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 15px; font-weight: 800; background: #f4ece0; color: #b9a990; cursor: pointer; }
.cell.head { background: transparent; color: var(--main); font-size: 17px; cursor: default; }
.cell.lv1 { background: #d5f2e2; color: var(--ink); }
.cell.lv2 { background: #8fdcb3; color: var(--ink); }
.cell.lv3 { background: var(--yellow); color: var(--ink); }
.cell.weak { background: #ffd0dc; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; font-size: 13px; color: var(--sub); margin: 12px 0; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
.table-info { text-align: center; min-height: 54px; font-size: 20px; font-weight: 800; }
.table-info small { display: block; font-size: 15px; color: var(--main-dark); }

/* result */
.result-emoji { font-size: 90px; text-align: center; }
.stars { text-align: center; font-size: 50px; letter-spacing: 6px; }
.stars span { display: inline-block; animation: stampIn .4s ease backwards; }
.result-msg { text-align: center; font-size: 20px; margin: 10px 0 20px; }

.confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

.t-feedback { min-height: 40px; font-size: 20px; font-weight: 800; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

/* テレビ・横長スクリーン：左右2カラム、文字は画面の高さに合わせて大きく */
@media (orientation: landscape) and (min-width: 900px) {
  #app { max-width: 1600px; padding: 2.5vh 3vw; }
  h1 { font-size: 7.5vh; margin: 2vh 0 1vh; }
  h2 { font-size: 4.4vh; margin: 1vh 0 2.5vh; }
  .lead { font-size: 2.8vh; margin-bottom: 2.5vh; }
  .back, .toggle { font-size: 2.6vh; padding: 1.2vh 1.8vw; border-radius: 2vh; }
  .battle-head { font-size: 3vh; }
  .split { display: grid; grid-template-columns: 1.15fr 1fr; gap: 3vw; align-items: center; }

  .stamps { max-width: 1000px; margin: 1vh auto 3.5vh; padding: 2vh; }
  .stamps-title { font-size: 2.4vh; }
  .stamp-row { gap: 1.2vw; }
  .stamp { font-size: 2.6vh; }
  .stamp.got { font-size: 4.5vh; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 3vh 2.5vw; max-width: 1300px; margin: 0 auto; }
  .menu .btn { margin: 0; padding: 5vh 2vw; font-size: 4.4vh; border-radius: 3vh; }
  .btn .ico { font-size: 5.5vh; }
  .voice-row { max-width: 460px; margin: 3.5vh auto 0; }
  .btn.small { font-size: 2.8vh; padding: 1.8vh; border-radius: 2vh; }

  .dan-grid { grid-template-columns: repeat(5, 1fr); gap: 2.5vh 1.6vw; max-width: 1300px; margin: 0 auto; }
  .dan-btn { aspect-ratio: auto; height: 25vh; font-size: 6vh; border-radius: 3vh; }
  .dan-btn small { font-size: 2.4vh; }
  .dan-btn .mon { font-size: 5vh; }
  .dan-btn .badge { font-size: 3vh; }
  .dan-btn.mix { grid-column: span 1; flex-direction: column; padding: 1vh; font-size: 2.8vh; height: 25vh; }
  .dan-btn.mix { white-space: normal; }

  .arena { height: 40vh; }
  .monster { font-size: 25vh; }
  .hp { height: 2.6vh; border-radius: 2vh; }
  .dmg { font-size: 6vh; }
  .question { font-size: 11vh; padding: 3vh 1vw; border-radius: 3vh; }
  .tools { margin: 2vh 0; }
  .tools button { font-size: 3vh; padding: 1.2vh 2vw; border-radius: 2vh; }
  .keypad { gap: 1.8vh 1vw; }
  .key { font-size: 6.5vh; padding: 2.4vh 0; border-radius: 2.5vh; }
  .key.del, .key.go { font-size: 3.8vh; }

  .timer { height: 2.6vh; margin: 1vh 0 4vh; }
  .t-feedback { min-height: 7vh; font-size: 3.6vh; }
  #tReady .btn { max-width: 600px; margin: 0 auto; font-size: 4vh; padding: 3vh; }

  .dots-box { padding: 3vh; border-radius: 3vh; }
  .dots-caption { font-size: 2.8vh; margin-bottom: 2vh; }
  .dots { gap: 0.8vh; }
  .dots.big .dot { width: 4.2vh; height: 4.2vh; }
  .learn-actions { margin-top: 2.5vh; }
  .learn-item { padding: 0.5vh 1.4vw; }
  .learn-item .eq { font-size: 3vh; }
  .learn-item .yomi { font-size: 1.9vh; }
  .learn-item .spk { font-size: 3vh; }

  #table .split { grid-template-columns: auto 1fr; }
  .kuku-table { width: min(74vh, 60vw); gap: 0.5vh; padding: 1.5vh; }
  .cell { font-size: 2.6vh; border-radius: 1vh; }
  .cell.head { font-size: 3vh; }
  .legend { flex-direction: column; align-items: flex-start; font-size: 2.8vh; gap: 1.5vh; width: fit-content; margin: 0 auto 4vh; }
  .legend span::before { width: 2.6vh; height: 2.6vh; border-radius: 0.6vh; vertical-align: -0.4vh; margin-right: 1vw; }
  .table-info { font-size: 5vh; }
  .table-info small { font-size: 2.8vh; margin-top: 1vh; }

  .result-emoji { font-size: 18vh; }
  .stars { font-size: 9vh; }
  .result-msg { font-size: 3.4vh; }
  #result .btn { max-width: 700px; margin: 0 auto 2.5vh; font-size: 3.6vh; padding: 2.6vh; }

  .modal-card { max-width: 800px; padding: 4vh 3vw; border-radius: 4vh; }
  .modal-card > div:first-child { font-size: 3.2vh !important; }
  .modal-card .big { font-size: 7vh; }
  .modal-card .yomi { font-size: 3.4vh; }
  .modal .dot { width: 3.6vh !important; height: 3.6vh !important; }
}

@media (max-width: 380px) {
  h1 { font-size: 32px; }
  .question { font-size: 38px; }
  .key { font-size: 26px; padding: 11px 0; }
  .monster { font-size: 80px; }
  .arena { height: 140px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ホーム -->
  <section class="screen active" id="home">
    <h1>くくの ぼうけん</h1>
    <p class="lead">モンスターを たおして スタンプを あつめよう！</p>
    <div class="stamps">
      <div class="stamps-title">クリア スタンプ</div>
      <div class="stamp-row" id="stampRow"></div>
    </div>
    <div class="menu">
      <button class="btn blue" data-go="learn"><span class="ico">📖</span>おぼえる</button>
      <button class="btn orange" data-go="battle"><span class="ico">⚔️</span>たたかう</button>
      <button class="btn green" data-go="time"><span class="ico">⏱️</span>タイムアタック</button>
      <button class="btn purple" data-go="table"><span class="ico">📊</span>くくひょう</button>
    </div>
    <div class="row voice-row">
      <button class="btn small" id="voiceBtn">🔊 こえ：オン</button>
    </div>
  </section>

  <!-- だん選択 -->
  <section class="screen" id="select">
    <div class="topbar"><button class="back" data-home>← もどる</button></div>
    <h2 id="selectTitle">どの だんに する？</h2>
    <div class="dan-grid" id="danGrid"></div>
  </section>

  <!-- おぼえる -->
  <section class="screen" id="learn">
    <div class="topbar"><button class="back" data-back-select>← もどる</button></div>
    <h2 id="learnTitle"></h2>
    <div class="split">
      <div class="split-main">
        <div class="dots-box">
          <div class="dots-caption" id="learnCaption">しきを タップすると こえと えが でるよ</div>
          <div class="dots big" id="learnDots"></div>
        </div>
        <div class="row learn-actions">
          <button class="btn small blue" id="readAllBtn">🔊 ぜんぶ よむ</button>
          <button class="btn small orange" id="learnToBattle">⚔️ たたかう</button>
        </div>
      </div>
      <div class="split-side">
        <div class="learn-list" id="learnList"></div>
      </div>
    </div>
  </section>

  <!-- たたかう -->
  <section class="screen" id="battle">
    <div class="topbar">
      <button class="back" data-home>← やめる</button>
      <div class="battle-head"><span id="bProgress"></span>&nbsp;&nbsp;<span class="combo" id="bCombo"></span></div>
    </div>
    <div class="split">
      <div class="split-main">
        <div class="arena" id="arena">
          <div class="monster" id="monster">🐛</div>
          <div class="hp"><div id="hpBar" style="width:100%"></div></div>
        </div>
        <div class="question" id="bQuestion"></div>
        <div class="tools"><button id="hintBtn">💡 ヒント</button></div>
      </div>
      <div class="split-side">
        <div class="keypad" id="bKeypad"></div>
      </div>
    </div>
  </section>

  <!-- タイムアタック -->
  <section class="screen" id="time">
    <div class="topbar">
      <button class="back" data-home>← やめる</button>
      <div class="battle-head"><span id="tScore">0 もん</span>&nbsp;&nbsp;<span id="tLeft">60 びょう</span></div>
    </div>
    <div id="tReady" style="text-align:center">
      <h2>60びょうで なんもん とけるかな？</h2>
      <p class="lead" id="tBest"></p>
      <p class="lead">にがてな もんだいが よく でるよ</p>
      <button class="btn green" id="tStart">スタート！</button>
    </div>
    <div id="tPlay" style="display:none">
      <div class="timer"><div id="tBar"></div></div>
      <div class="split">
        <div class="split-main">
          <div class="question" id="tQuestion"></div>
          <div class="tools t-feedback"><span id="tFeedback"></span></div>
        </div>
        <div class="split-side">
          <div class="keypad" id="tKeypad"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- くくひょう -->
  <section class="screen" id="table">
    <div class="topbar"><button class="back" data-home>← もどる</button></div>
    <h2>くくひょう</h2>
    <p class="lead" id="tableSummary"></p>
    <div class="split">
      <div class="split-main">
        <div class="kuku-table" id="kukuTable"></div>
      </div>
      <div class="split-side">
        <div class="legend">
          <span style="--c:#f4ece0">まだ</span>
          <span style="--c:#d5f2e2">できた</span>
          <span style="--c:#8fdcb3">とくい</span>
          <span style="--c:#ffd23f">マスター</span>
          <span style="--c:#ffd0dc">にがて</span>
        </div>
        <div class="table-info" id="tableInfo">マスを タップしてみよう</div>
      </div>
    </div>
  </section>

  <!-- けっか -->
  <section class="screen" id="result">
    <div class="result-emoji" id="rEmoji">🎉</div>
    <h2 id="rTitle"></h2>
    <div class="stars" id="rStars"></div>
    <div class="result-msg" id="rMsg"></div>
    <button class="btn orange" id="rRetry">もういちど</button>
    <button class="btn" data-home>ホームへ</button>
  </section>
</div>

<!-- まちがえたとき -->
<div class="modal" id="ngModal">
  <div class="modal-card">
    <div style="font-size:20px">おしい！ こたえは…</div>
    <div class="big" id="ngEq"></div>
    <div class="yomi" id="ngYomi"></div>
    <div class="dots" id="ngDots" style="margin:8px 0 14px"></div>
    <div class="dots-caption" id="ngCaption"></div>
    <button class="btn orange small" id="ngNext" style="margin:0">わかった！</button>
  </div>
</div>

<!-- ヒント -->
<div class="modal" id="hintModal">
  <div class="modal-card">
    <div style="font-size:20px;font-weight:800">💡 ヒント</div>
    <div class="dots-caption" id="hintCaption" style="margin-top:8px"></div>
    <div class="dots" id="hintDots" style="margin:8px 0 14px"></div>
    <button class="btn blue small" id="hintClose" style="margin:0">とじる</button>
  </div>
</div>

<script>
// ===== データ =====
const YOMI = {
  1: ['いんいちが いち','いんにが に','いんさんが さん','いんしが し','いんごが ご','いんろくが ろく','いんしちが しち','いんはちが はち','いんくが く'],
  2: ['にいちが に','ににんが し','にさんが ろく','にしが はち','にご じゅう','にろく じゅうに','にしち じゅうし','にはち じゅうろく','にく じゅうはち'],
  3: ['さんいちが さん','さんにが ろく','さざんが く','さんし じゅうに','さんご じゅうご','さぶろく じゅうはち','さんしち にじゅういち','さんぱ にじゅうし','さんく にじゅうしち'],
  4: ['しいちが し','しにが はち','しさん じゅうに','しし じゅうろく','しご にじゅう','しろく にじゅうし','ししち にじゅうはち','しは さんじゅうに','しく さんじゅうろく'],
  5: ['ごいちが ご','ごに じゅう','ごさん じゅうご','ごし にじゅう','ごご にじゅうご','ごろく さんじゅう','ごしち さんじゅうご','ごは しじゅう','ごっく しじゅうご'],
  6: ['ろくいちが ろく','ろくに じゅうに','ろくさん じゅうはち','ろくし にじゅうし','ろくご さんじゅう','ろくろく さんじゅうろく','ろくしち しじゅうに','ろくは しじゅうはち','ろっく ごじゅうし'],
  7: ['しちいちが しち','しちに じゅうし','しちさん にじゅういち','しちし にじゅうはち','しちご さんじゅうご','しちろく しじゅうに','しちしち しじゅうく','しちは ごじゅうろく','しちく ろくじゅうさん'],
  8: ['はちいちが はち','はちに じゅうろく','はちさん にじゅうし','はちし さんじゅうに','はちご しじゅう','はちろく しじゅうはち','はちしち ごじゅうろく','はっぱ ろくじゅうし','はっく しちじゅうに'],
  9: ['くいちが く','くに じゅうはち','くさん にじゅうしち','くし さんじゅうろく','くご しじゅうご','くろく ごじゅうし','くしち ろくじゅうさん','くは しちじゅうに','くく はちじゅういち'],
};
const MONSTERS = { 1:'🐛', 2:'🐸', 3:'🐙', 4:'🦀', 5:'🐊', 6:'🦈', 7:'🦂', 8:'🐲', 9:'🦖', mix:'👾' };
const DOT_COLORS = ['#ff7a59','#4aa3ff','#4cc38a','#ffb321','#ff8fb1','#9b7bff','#2ec4c4','#e8743b','#7a9cff'];
const $ = id => document.getElementById(id);

// ===== セーブ =====
let save = { stats: {}, stamps: {}, best: 0, voice: true };
try { const s = JSON.parse(localStorage.getItem('kuku-save')); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem('kuku-save', JSON.stringify(save)); } catch (e) {} }
function stat(a, b) { const k = a + 'x' + b; return save.stats[k] || (save.stats[k] = { ok: 0, ng: 0 }); }
function level(a, b) {
  const s = save.stats[a + 'x' + b];
  if (!s || s.ok + s.ng === 0) return 0;
  if (s.ng > s.ok) return -1;
  if (s.ok >= 5 && s.ng * 4 <= s.ok) return 3;
  if (s.ok >= 2) return 2;
  return 1;
}
// にがてな問題ほど出やすくする
function weight(a, b) {
  const s = stat(a, b);
  return 1 + (s.ok === 0 ? 1 : 0) + 4 * s.ng / (s.ok + s.ng + 1);
}
function pickWeighted(list) {
  const ws = list.map(([a, b]) => weight(a, b));
  let r = Math.random() * ws.reduce((x, y) => x + y, 0);
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// ===== こえ・おと =====
function speak(text) {
  if (!save.voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.95; u.pitch = 1.2;
  speechSynthesis.speak(u);
}
let actx;
function tone(freqs, dur = 0.12, type = 'sine') {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t = actx.currentTime + i * dur;
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.6);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}
const sfx = {
  ok: () => tone([880, 1320], 0.09),
  ng: () => tone([220, 180], 0.15, 'square'),
  key: () => tone([600], 0.04, 'triangle'),
  win: () => tone([523, 659, 784, 1047], 0.13),
};

// ===== がめん =====
let current = 'home';
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  current = id;
  if (id !== 'time') stopTime();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  learnReading = false;
  window.scrollTo(0, 0);
  if (id === 'home') renderStamps();
}
document.querySelectorAll('[data-home]').forEach(b => b.onclick = () => show('home'));
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  const g = b.dataset.go;
  if (g === 'learn' || g === 'battle') openSelect(g);
  if (g === 'time') openTime();
  if (g === 'table') openTable();
});
document.querySelector('[data-back-select]').onclick = () => openSelect('learn');

function renderVoice() { $('voiceBtn').textContent = save.voice ? '🔊 こえ：オン' : '🔇 こえ：オフ'; }
$('voiceBtn').onclick = () => { save.voice = !save.voice; persist(); renderVoice(); if (save.voice) speak('こえ オン'); };

function renderStamps() {
  $('stampRow').innerHTML = '';
  for (let d = 1; d <= 9; d++) {
    const el = document.createElement('div');
    el.className = 'stamp' + (save.stamps[d] ? ' got' : '');
    el.textContent = save.stamps[d] ? MONSTERS[d] : d;
    $('stampRow').appendChild(el);
  }
}

// ===== ドット =====
function renderDots(el, a, b) {
  el.innerHTML = '';
  el.style.gridTemplateColumns = `repeat(${b}, auto)`;
  const small = a * b > 40;
  for (let r = 0; r < a; r++) for (let c = 0; c < b; c++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.background = DOT_COLORS[r % DOT_COLORS.length];
    if (small && !el.classList.contains('big')) { d.style.width = d.style.height = '13px'; }
    el.appendChild(d);
  }
}
function dotCaption(a, b) { return `${b}こ の まとまりが ${a}れつ あるよ`; }

// ===== だん選択 =====
let selectMode = 'battle';
function openSelect(mode) {
  selectMode = mode;
  $('selectTitle').textContent = mode === 'learn' ? 'どの だんを おぼえる？' : 'どの だんと たたかう？';
  const g = $('danGrid'); g.innerHTML = '';
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement('button');
    b.className = 'dan-btn';
    b.innerHTML = (mode === 'battle' ? `<span class="mon">${MONSTERS[d]}</span>` : '') +
      `${d}<small>のだん</small>` + (save.stamps[d] ? '<span class="badge">⭐</span>' : '');
    b.onclick = () => mode === 'learn' ? openLearn(d) : startBattle(d);
    g.appendChild(b);
  }
  if (mode === 'battle') {
    const m = document.createElement('button');
    m.className = 'dan-btn mix';
    m.innerHTML = `${MONSTERS.mix} ミックス（ぜんぶの だん）`;
    m.onclick = () => startBattle('mix');
    g.appendChild(m);
  }
  show('select');
}

// ===== おぼえる =====
let learnDan = 1, learnReading = false;
function openLearn(d) {
  learnDan = d;
  $('learnTitle').textContent = `${d} の だん`;
  $('learnCaption').textContent = 'しきを タップすると こえと えが でるよ';
  $('learnDots').innerHTML = '';
  const list = $('learnList'); list.innerHTML = '';
  for (let b = 1; b <= 9; b++) {
    const it = document.createElement('div');
    it.className = 'learn-item';
    it.innerHTML = `<div><div class="eq">${d} × ${b} = ${d * b}</div><div class="yomi">${YOMI[d][b - 1]}</div></div><div class="spk">🔊</div>`;
    it.onclick = () => { learnReading = false; focusLearn(b); speak(YOMI[d][b - 1]); };
    list.appendChild(it);
  }
  show('learn');
}
function focusLearn(b) {
  const d = learnDan;
  [...$('learnList').children].forEach((el, i) => el.classList.toggle('on', i === b - 1));
  $('learnCaption').textContent = `${d} × ${b} = ${d * b}　（${dotCaption(d, b)}）`;
  renderDots($('learnDots'), d, b);
}
$('readAllBtn').onclick = () => {
  if (!('speechSynthesis' in window) || !save.voice) { alert('こえを オンにしてね'); return; }
  speechSynthesis.cancel();
  learnReading = true;
  let b = 1;
  const next = () => {
    if (!learnReading || b > 9 || current !== 'learn') { learnReading = false; return; }
    focusLearn(b);
    const u = new SpeechSynthesisUtterance(YOMI[learnDan][b - 1]);
    u.lang = 'ja-JP'; u.rate = 0.95; u.pitch = 1.2;
    u.onend = () => { b++; setTimeout(next, 250); };
    speechSynthesis.speak(u);
  };
  next();
};
$('learnToBattle').onclick = () => startBattle(learnDan);

// ===== キーパッド =====
function buildKeypad(el, onDigit, onDel, onGo) {
  el.innerHTML = '';
  ['7','8','9','4','5','6','1','2','3','del','0','go'].forEach(k => {
    const b = document.createElement('button');
    b.className = 'key' + (k === 'del' ? ' del' : k === 'go' ? ' go' : '');
    b.textContent = k === 'del' ? 'けす' : k === 'go' ? 'こたえる' : k;
    b.onclick = () => { if (k === 'del') onDel(); else if (k === 'go') onGo(); else onDigit(k); };
    el.appendChild(b);
  });
}
document.addEventListener('keydown', e => {
  const modalOpen = $('ngModal').classList.contains('show') || $('hintModal').classList.contains('show');
  if (modalOpen) {
    if (e.key === 'Enter' || e.key === 'Escape') {
      e.preventDefault();
      if ($('ngModal').classList.contains('show')) $('ngNext').click(); else $('hintClose').click();
    }
    return;
  }
  const h = current === 'battle' ? battleInput : current === 'time' && timePlaying ? timeInput : null;
  if (!h) return;
  // リモコンの「決定」でフォーカス中のボタンを押したときは、そのボタンの動作を優先する
  if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  if (/^[0-9]$/.test(e.key)) h.digit(e.key);
  else if (e.key === 'Backspace') h.del();
  else if (e.key === 'Enter') { e.preventDefault(); h.go(); }
});

// ===== たたかう =====
let B = null;
function startBattle(dan) {
  let queue;
  if (dan === 'mix') {
    const all = [];
    for (let a = 2; a <= 9; a++) for (let b = 1; b <= 9; b++) all.push([a, b]);
    queue = [];
    while (queue.length < 12) {
      const p = pickWeighted(all);
      if (!queue.some(q => q[0] === p[0] && q[1] === p[1])) queue.push(p);
    }
  } else {
    queue = shuffle([1,2,3,4,5,6,7,8,9].map(b => [dan, b]));
  }
  B = { dan, queue, total: queue.length, done: 0, miss: 0, combo: 0, input: '', lock: false, missed: new Set() };
  const m = $('monster');
  m.className = 'monster';
  m.textContent = MONSTERS[dan];
  $('hpBar').style.width = '100%';
  show('battle');
  nextBattleQ();
}
function nextBattleQ() {
  B.input = ''; B.lock = false;
  $('bQuestion').className = 'question';
  renderBattleQ();
  $('bProgress').textContent = `のこり ${B.total - B.done} たい力`;
  $('bCombo').textContent = B.combo >= 2 ? `🔥 ${B.combo} れんぞく！` : '';
}
function renderBattleQ() {
  const [a, b] = B.queue[0];
  $('bQuestion').innerHTML = `${a} × ${b} = <span class="ans">${B.input || '&nbsp;'}</span>`;
}
const battleInput = {
  digit(k) { if (B.lock || B.input.length >= 2) return; sfx.key(); B.input = (B.input === '0' ? '' : B.input) + k; renderBattleQ(); },
  del() { if (B.lock) return; B.input = B.input.slice(0, -1); renderBattleQ(); },
  go() {
    if (B.lock || B.input === '') return;
    B.lock = true;
    const [a, b] = B.queue[0];
    const s = stat(a, b);
    if (+B.input === a * b) {
      s.ok++; persist();
      B.queue.shift(); B.done++; B.combo++;
      sfx.ok(); speak(YOMI[a][b - 1]);
      $('bQuestion').classList.add('ok');
      const m = $('monster');
      m.classList.remove('hit'); void m.offsetWidth; m.classList.add('hit');
      const dmg = document.createElement('div');
      dmg.className = 'dmg';
      dmg.textContent = B.combo >= 3 ? 'クリティカル！' : 'えいっ！';
      $('arena').appendChild(dmg);
      setTimeout(() => dmg.remove(), 800);
      $('hpBar').style.width = (100 * (B.total - B.done) / B.total) + '%';
      if (B.queue.length === 0) setTimeout(winBattle, 700);
      else setTimeout(nextBattleQ, 900);
    } else {
      s.ng++; persist();
      B.miss++; B.combo = 0; B.missed.add(a + 'x' + b);
      sfx.ng();
      $('bQuestion').classList.add('ng');
      const m = $('monster');
      m.classList.remove('angry'); void m.offsetWidth; m.classList.add('angry');
      // まちがえた問題は少しあとでもう一度
      const q = B.queue.shift();
      B.queue.splice(Math.min(2, B.queue.length), 0, q);
      setTimeout(() => showNg(a, b), 450);
    }
  }
};
buildKeypad($('bKeypad'), k => battleInput.digit(k), () => battleInput.del(), () => battleInput.go());

function showNg(a, b) {
  $('ngEq').textContent = `${a} × ${b} = ${a * b}`;
  $('ngYomi').textContent = YOMI[a][b - 1];
  $('ngCaption').textContent = dotCaption(a, b);
  renderDots($('ngDots'), a, b);
  $('ngModal').classList.add('show');
  speak(YOMI[a][b - 1]);
}
$('ngNext').onclick = () => { $('ngModal').classList.remove('show'); nextBattleQ(); };

$('hintBtn').onclick = () => {
  if (!B || B.lock) return;
  const [a, b] = B.queue[0];
  $('hintCaption').textContent = `${dotCaption(a, b)}。ぜんぶで いくつ？`;
  renderDots($('hintDots'), a, b);
  $('hintModal').classList.add('show');
};
$('hintClose').onclick = () => $('hintModal').classList.remove('show');

function winBattle() {
  $('monster').classList.add('dead');
  sfx.win();
  setTimeout(() => {
    const stars = B.miss === 0 ? 3 : B.miss <= 2 ? 2 : 1;
    let msg = '';
    if (B.dan !== 'mix') {
      const first = !save.stamps[B.dan];
      save.stamps[B.dan] = true; persist();
      msg = first ? `${B.dan}のだんの スタンプを ゲット！` : '';
    }
    const praise = stars === 3 ? 'ノーミス！ すごすぎる！' : stars === 2 ? 'よく がんばったね！' : 'さいごまで できたね！ つぎは ノーミスを めざそう';
    showResult({
      emoji: '🎉', title: `${MONSTERS[B.dan]} を たおした！`, stars,
      msg: `${praise}<br>${msg}` + (B.missed.size ? `<br><small>にがて：${[...B.missed].map(k => k.replace('x', '×')).join('、')}</small>` : ''),
      retry: () => startBattle(B.dan),
    });
  }, 800);
}

// ===== タイムアタック =====
let T = null, timePlaying = false, timeTimer = null;
const TIME_LIMIT = 60;
function openTime() {
  stopTime();
  $('tReady').style.display = ''; $('tPlay').style.display = 'none';
  $('tScore').textContent = '0 もん'; $('tLeft').textContent = TIME_LIMIT + ' びょう';
  $('tBest').textContent = save.best ? `じこベスト：${save.best} もん` : 'はじめての ちょうせん！';
  show('time');
}
$('tStart').onclick = () => {
  $('tReady').style.display = 'none'; $('tPlay').style.display = '';
  const all = [];
  for (let a = 2; a <= 9; a++) for (let b = 2; b <= 9; b++) all.push([a, b]);
  T = { all, score: 0, input: '', q: null, end: Date.now() + TIME_LIMIT * 1000, lock: false };
  timePlaying = true;
  nextTimeQ();
  timeTimer = setInterval(tickTime, 100);
};
function tickTime() {
  const left = Math.max(0, T.end - Date.now());
  $('tBar').style.width = (100 * left / (TIME_LIMIT * 1000)) + '%';
  $('tLeft').textContent = Math.ceil(left / 1000) + ' びょう';
  if (left <= 0) finishTime();
}
function stopTime() { clearInterval(timeTimer); timeTimer = null; timePlaying = false; }
function nextTimeQ() {
  let q;
  do { q = pickWeighted(T.all); } while (T.q && q[0] === T.q[0] && q[1] === T.q[1]);
  T.q = q; T.input = ''; T.lock = false;
  $('tQuestion').className = 'question';
  renderTimeQ();
}
function renderTimeQ() {
  const [a, b] = T.q;
  $('tQuestion').innerHTML = `${a} × ${b} = <span class="ans">${T.input || '&nbsp;'}</span>`;
}
const timeInput = {
  digit(k) { if (T.lock || T.input.length >= 2) return; sfx.key(); T.input = (T.input === '0' ? '' : T.input) + k; renderTimeQ(); },
  del() { if (T.lock) return; T.input = T.input.slice(0, -1); renderTimeQ(); },
  go() {
    if (T.lock || T.input === '') return;
    T.lock = true;
    const [a, b] = T.q, s = stat(a, b);
    if (+T.input === a * b) {
      s.ok++; T.score++; sfx.ok();
      $('tQuestion').classList.add('ok');
      $('tFeedback').textContent = '⭕ せいかい！';
      $('tScore').textContent = T.score + ' もん';
      setTimeout(() => { if (timePlaying) { $('tFeedback').textContent = ''; nextTimeQ(); } }, 300);
    } else {
      s.ng++; sfx.ng();
      $('tQuestion').classList.add('ng');
      $('tFeedback').textContent = `こたえは ${a * b}（${YOMI[a][b - 1]}）`;
      setTimeout(() => { if (timePlaying) { $('tFeedback').textContent = ''; nextTimeQ(); } }, 1500);
    }
    persist();
  }
};
buildKeypad($('tKeypad'), k => timeInput.digit(k), () => timeInput.del(), () => timeInput.go());

function finishTime() {
  stopTime();
  $('tFeedback').textContent = '';
  const score = T.score, newBest = score > save.best;
  if (newBest) { save.best = score; persist(); }
  sfx.win();
  const stars = score >= 25 ? 3 : score >= 15 ? 2 : 1;
  showResult({
    emoji: newBest ? '🏆' : '⏱️', title: `${score} もん せいかい！`, stars,
    msg: newBest ? 'じこベスト こうしん！ やったね！' : `じこベストは ${save.best} もん。おしい！`,
    retry: openTime,
  });
}

// ===== くくひょう =====
function openTable() {
  const t = $('kukuTable'); t.innerHTML = '';
  let master = 0;
  const head = txt => { const c = document.createElement('div'); c.className = 'cell head'; c.textContent = txt; t.appendChild(c); };
  head('×');
  for (let b = 1; b <= 9; b++) head(b);
  for (let a = 1; a <= 9; a++) {
    head(a);
    for (let b = 1; b <= 9; b++) {
      const lv = level(a, b);
      if (lv === 3) master++;
      const c = document.createElement('div');
      c.className = 'cell' + (lv === -1 ? ' weak' : lv > 0 ? ' lv' + lv : '');
      c.textContent = a * b;
      c.onclick = () => {
        const s = save.stats[a + 'x' + b] || { ok: 0, ng: 0 };
        $('tableInfo').innerHTML = `${a} × ${b} = ${a * b}<small>${YOMI[a][b - 1]}　（⭕${s.ok}　❌${s.ng}）</small>`;
        speak(YOMI[a][b - 1]);
      };
      t.appendChild(c);
    }
  }
  $('tableSummary').textContent = `マスター ${master} / 81　ぜんぶ きんいろに しよう！`;
  $('tableInfo').textContent = 'マスを タップしてみよう';
  show('table');
}

// ===== けっか =====
let retryFn = null;
function showResult({ emoji, title, stars, msg, retry }) {
  $('rEmoji').textContent = emoji;
  $('rTitle').textContent = title;
  $('rStars').innerHTML = [1, 2, 3].map(i => `<span style="animation-delay:${i * 0.2}s">${i <= stars ? '⭐' : '☆'}</span>`).join('');
  $('rMsg').innerHTML = msg;
  retryFn = retry;
  show('result');
  if (stars >= 2) confetti();
}
$('rRetry').onclick = () => retryFn && retryFn();

function confetti() {
  const colors = ['#ff7a59', '#4aa3ff', '#4cc38a', '#ffd23f', '#ff8fb1', '#9b7bff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
    c.style.animationDelay = Math.random() * 0.6 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

renderVoice();
renderStamps();
</script>
